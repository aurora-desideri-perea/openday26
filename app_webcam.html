<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Selective Therapy Game</title>
<script src="tf.min.js"></script>
<style>
body { font-family: 'Comic Sans MS', cursive, sans-serif; text-align: center; margin-top: 30px; background-color: #e0f7fa; color: #333; }
.container { display: flex; justify-content: center; gap: 40px; align-items: flex-start; margin-top: 20px; }
.camera-container { display: flex; flex-direction: column; align-items: center; }
video { border: 4px solid #006064; background-color: black; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); object-fit: cover; }
.instructions { max-width: 300px; background: white; padding: 20px; border-radius: 12px; border: 3px solid #00acc1; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left; }
button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background-color: #00838f; color: white; font-weight: bold; transition: background 0.3s; }
button:hover { background-color: #00acc1; }
button:disabled { background-color: #b2ebf2; cursor: not-allowed; color: #777; }
h1 { color: #006064; font-size: 2.5em; }
#resultText { margin-top: 20px; font-size: 1.5em; font-weight: bold; padding: 15px; border-radius: 8px; display: inline-block; min-width: 300px; background-color: #fff3e0; }
canvas { display: none; }
</style>
</head>
<body>

<h1>Target the Bad Scissor! ✂️</h1>

<div class="container">
    <div class="instructions">
        <h3>How to Play:</h3>
        <p><strong>1. Good Scissor:</strong> Has a Triangle notch. We want to leave it alone!</p>
        <p><strong>2. Bad Scissor:</strong> Has a Rectangle notch. We need to block it!</p>
        <p>Draw a <strong>Rectangle</strong> inhibitor on paper. Hold it up to the camera and test it!</p>
    </div>

    <div class="camera-container">
        <video id="webcam" width="300" height="300" autoplay playsinline></video>
        <canvas id="snapshot" width="300" height="300"></canvas>
        <div>
            <button onclick="predictDrawing()" id="predBtn" disabled>Loading AI...</button>
        </div>
        <div id="resultText">AI is learning shapes. Please wait...</div>
    </div>
</div>

<script>
const video = document.getElementById('webcam');
const snapCanvas = document.getElementById('snapshot');
const snapCtx = snapCanvas.getContext('2d');
const resultText = document.getElementById('resultText');
const predBtn = document.getElementById('predBtn');
let model;

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {
        video.srcObject = stream;
    })
    .catch(err => {
        resultText.innerText = "Camera access denied or unavailable.";
    });

async function trainLocalModel() {
    model = tf.sequential();
    model.add(tf.layers.conv2d({inputShape: [28, 28, 1], filters: 16, kernelSize: 3, activation: 'relu'}));
    model.add(tf.layers.maxPooling2d({poolSize: 2}));
    model.add(tf.layers.flatten());
    model.add(tf.layers.dense({units: 64, activation: 'relu'}));
    model.add(tf.layers.dense({units: 3, activation: 'softmax'}));
    model.compile({optimizer: 'adam', loss: 'categoricalCrossentropy', metrics: ['accuracy']});

    const xs = [];
    const ys = [];
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 100;
    offCanvas.height = 100;
    const offCtx = offCanvas.getContext('2d');

    for (let i = 0; i < 300; i++) {
        offCtx.fillStyle = 'white';
        offCtx.fillRect(0, 0, 100, 100);
        offCtx.lineWidth = 6;
        offCtx.strokeStyle = 'black';
        
        const w = 30 + Math.random() * 40;
        const h = 20 + Math.random() * 50;
        const x = 10 + Math.random() * (90 - w - 10);
        const y = 10 + Math.random() * (90 - h - 10);
        offCtx.strokeRect(x, y, w, h);
        
        let tensorRect = tf.browser.fromPixels(offCanvas, 1).resizeBilinear([28, 28]).toFloat().div(255);
        xs.push(tensorRect);
        ys.push([1, 0, 0]);

        offCtx.fillStyle = 'white';
        offCtx.fillRect(0, 0, 100, 100);
        offCtx.beginPath();
        const tx = 50 + (Math.random() * 20 - 10);
        const ty = 20 + (Math.random() * 10 - 5);
        offCtx.moveTo(tx, ty);
        offCtx.lineTo(tx - (20 + Math.random() * 20), ty + (40 + Math.random() * 20));
        offCtx.lineTo(tx + (20 + Math.random() * 20), ty + (40 + Math.random() * 20));
        offCtx.closePath();
        offCtx.stroke();

        let tensorTri = tf.browser.fromPixels(offCanvas, 1).resizeBilinear([28, 28]).toFloat().div(255);
        xs.push(tensorTri);
        ys.push([0, 1, 0]);

        offCtx.fillStyle = 'white';
        offCtx.fillRect(0, 0, 100, 100);
        for (let j = 0; j < 8; j++) {
            offCtx.beginPath();
            offCtx.moveTo(Math.random() * 100, Math.random() * 100);
            offCtx.lineTo(Math.random() * 100, Math.random() * 100);
            offCtx.stroke();
        }

        let tensorNoise = tf.browser.fromPixels(offCanvas, 1).resizeBilinear([28, 28]).toFloat().div(255);
        xs.push(tensorNoise);
        ys.push([0, 0, 1]);
    }

    const xTensor = tf.stack(xs);
    const yTensor = tf.tensor2d(ys);

    await model.fit(xTensor, yTensor, {epochs: 15, batchSize: 32});
    
    predBtn.disabled = false;
    predBtn.innerText = 'Scan Paper';
    resultText.innerText = 'AI Ready! Hold your drawing to the camera.';
    resultText.style.backgroundColor = '#e8f5e9';
    
    tf.dispose([xs, ys, xTensor, yTensor]);
}

async function predictDrawing() {
    snapCtx.drawImage(video, 0, 0, 300, 300);
    
    let imgData = snapCtx.getImageData(0, 0, 300, 300);
    let data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i+1];
        let b = data[i+2];
        let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
        let val = brightness < 100 ? 0 : 255;
        data[i] = val;
        data[i+1] = val;
        data[i+2] = val;
    }
    snapCtx.putImageData(imgData, 0, 0);

    const tensor = tf.browser.fromPixels(snapCanvas, 1).resizeBilinear([28, 28]).toFloat().div(255).expandDims();
    const prediction = model.predict(tensor).dataSync();
    
    const labels = ["Selective Inhibitor! 🟢", "Toxic! Hits Good Scissor 🔴", "Invalid Shape! (Scribble) ⚫"];
    const colors = ["#c8e6c9", "#ffccbc", "#cfd8dc"];
    
    const maxIndex = prediction.indexOf(Math.max(...prediction));
    const confidence = Math.round(prediction[maxIndex] * 100);
    
    resultText.innerText = labels[maxIndex] + " (" + confidence + "%)";
    resultText.style.backgroundColor = colors[maxIndex];
    
    tensor.dispose();
}

trainLocalModel();
</script>
</body>
</html>
